# The test guests, one line each:
#
#   name  disk                                ram   cpus  vnc  firmware
#
# ram is MiB, vnc is the display number (5900 + it is the port), and
# firmware is uefi or bios. A disk path may be ~-relative.
#
# These are *this machine's* guests. The file is committed because the
# shape of it is the documentation; change the paths to yours. Nothing
# here is created by the scripts except what install-win11.sh installs.
#
# win10 is the user's own general-purpose Windows 10 (it has other
# software on it); it auto-logs in, which is all the harness needs, so it
# is adopted rather than duplicated — a second 50 GB image would buy
# nothing. win11 is this repository's own, installed by
# tools/vm/install-win11.sh with a known password and autologon.
win10  ~/VMs/win10/win10.qcow2      8192  4  10  bios
win11  ~/VMs/uitk/win11/disk.qcow2  6144  4  11  uefi
